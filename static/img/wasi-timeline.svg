<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 252" width="1200" height="252">
  <title>WASI release timeline</title>
  <!-- Colors follow the reader's OS light or dark preference. An SVG loaded via
       <img> cannot see the host page's theme toggle, so this tracks the system
       setting, which is also what the site defaults to. -->
  <style>
    .ink { stroke: #5b6270; }
    .fill { fill: #5b6270; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #9ca3af; }
      .fill { fill: #9ca3af; }
    }
  </style>
  <g class="ink" fill="none" stroke-width="2">
    <line x1="45" y1="120" x2="1140" y2="120" />
    <line x1="110" y1="102" x2="110" y2="120" />
    <line x1="365" y1="102" x2="365" y2="120" />
    <line x1="620" y1="102" x2="620" y2="120" />
    <line x1="875" y1="102" x2="875" y2="120" />
    <line x1="257.9" y1="120" x2="257.9" y2="136" />
    <line x1="301.2" y1="120" x2="301.2" y2="136" />
    <line x1="347.2" y1="120" x2="347.2" y2="136" />
    <line x1="390.5" y1="120" x2="390.5" y2="136" />
    <line x1="428.8" y1="120" x2="428.8" y2="136" />
    <line x1="477.2" y1="120" x2="477.2" y2="136" />
    <line x1="520.5" y1="120" x2="520.5" y2="136" />
    <line x1="561.3" y1="120" x2="561.3" y2="136" />
    <line x1="599.6" y1="120" x2="599.6" y2="136" />
    <line x1="642.9" y1="120" x2="642.9" y2="136" />
    <line x1="686.3" y1="120" x2="686.3" y2="136" />
    <line x1="727.1" y1="120" x2="727.1" y2="136" />
    <line x1="775.5" y1="120" x2="775.5" y2="136" />
    <line x1="128" y1="127" x2="128" y2="178" />
    <line x1="732" y1="127" x2="732" y2="178" />
  </g>
  <!-- Releases that have not shipped yet are dashed. Move a tick into the solid
       group above when it ships. -->
  <g class="ink" fill="none" stroke-width="2" stroke-dasharray="3 3">
    <line x1="818.9" y1="120" x2="818.9" y2="136" />
    <line x1="859.7" y1="120" x2="859.7" y2="136" />
    <line x1="903.0" y1="120" x2="903.0" y2="136" />
    <line x1="946.4" y1="120" x2="946.4" y2="136" />
    <line x1="987.2" y1="120" x2="987.2" y2="136" />
    <line x1="1030.5" y1="120" x2="1030.5" y2="136" />
    <line x1="1073.9" y1="120" x2="1073.9" y2="136" />
    <line x1="1117.3" y1="120" x2="1117.3" y2="136" />
  </g>
  <g class="fill">
    <polygon points="1140,113 1162,120 1140,127" />
    <circle cx="128" cy="120" r="5" />
    <circle cx="732" cy="120" r="5" />
  </g>
  <g class="fill" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="26">
    <text x="110" y="88" text-anchor="middle">2024</text>
    <text x="365" y="88" text-anchor="middle">2025</text>
    <text x="620" y="88" text-anchor="middle">2026</text>
    <text x="875" y="88" text-anchor="middle">2027</text>
    <text x="492.5" y="164" text-anchor="middle" font-size="23">0.2.1 to 0.2.12</text>
    <text x="946.4" y="164" text-anchor="middle" font-size="23">0.3.x every two months (planned)</text>
    <text x="128" y="206" text-anchor="middle">WASI 0.2.0</text>
    <text x="128" y="234" text-anchor="middle">January 2024</text>
    <text x="732" y="206" text-anchor="middle">WASI 0.3.0</text>
    <text x="732" y="234" text-anchor="middle">June 2026</text>
  </g>
</svg>
