  <title id="title">WASI release timeline</title>
  <desc id="desc">WASI 0.2.0 shipped in January 2024, followed by patch releases 0.2.1 through 0.2.12 every two months. WASI 0.3.0 shipped in June 2026, followed by 0.3.x patch releases every two months through 2027.</desc>
